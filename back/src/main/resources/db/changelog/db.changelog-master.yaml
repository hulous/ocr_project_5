databaseChangeLog:
  - changeSet:
      id: 1
      author: liquibase
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp
  - changeSet:
      id: 2
      author: liquibase
      changes:
        - createTable:
            tableName: topics
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
  - changeSet:
      id: 3
      author: liquibase
      changes:
        - createTable:
            tableName: subscriptions
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: topic_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
        - addForeignKeyConstraint:
            baseTableName: subscriptions
            baseColumnNames: user_id
            constraintName: fk_subscriptions_user_id
            referencedTableName: users
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: subscriptions
            baseColumnNames: topic_id
            constraintName: fk_subscriptions_topic_id
            referencedTableName: topics
            referencedColumnNames: id
  - changeSet:
      id: 4
      author: liquibase
      changes:
        - createTable:
            tableName: posts
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: author_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: topic_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp
        - addForeignKeyConstraint:
            baseTableName: posts
            baseColumnNames: author_id
            constraintName: fk_posts_author_id
            referencedTableName: users
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: posts
            baseColumnNames: topic_id
            constraintName: fk_posts_topic_id
            referencedTableName: topics
            referencedColumnNames: id
  - changeSet:
      id: 5
      author: liquibase
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: author_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: post_id
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: author_id
            constraintName: fk_comments_author_id
            referencedTableName: users
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: post_id
            constraintName: fk_comments_post_id
            referencedTableName: posts
            referencedColumnNames: id
  - changeSet:
      id: 6
      author: liquibase
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: SELECT COUNT(*) FROM topics
      changes:
        - insert:
            tableName: topics
            columns:
              - column:
                  name: title
                  value: "General"
              - column:
                  name: description
                  value: "General discussions about platform use and announcements."
        - insert:
            tableName: topics
            columns:
              - column:
                  name: title
                  value: "Development"
              - column:
                  name: description
                  value: "Technical tutorials, tips, and code review discussions."
        - insert:
            tableName: topics
            columns:
              - column:
                  name: title
                  value: "Community"
              - column:
                  name: description
                  value: "Community events, meetups, and introductions."
        - insert:
            tableName: topics
            columns:
              - column:
                  name: title
                  value: "Features"
              - column:
                  name: description
                  value: "Ideas and feature requests for improving the platform."
        - insert:
            tableName: topics
            columns:
              - column:
                  name: title
                  value: "Support"
              - column:
                  name: description
                  value: "Help and troubleshooting for users encountering issues."
