<div class="sign_in_or_up_form" fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="32px">
  <app-not-logged-logo></app-not-logged-logo>

  <mat-card class="mdd-card">
    <mat-card-title>
      <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="12px">
        <button mat-icon-button routerLink="/home">
          <mat-icon>arrow_back</mat-icon>
        </button>
        <span class="mdd-page-title">Se connecter</span>
      </div>
    </mat-card-title>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-card-content fxLayout="column" fxLayoutGap="24px">
        <mat-form-field appearance="outline" class="mdd-field">
          <mat-label>E-mail ou nom d’utilisateur</mat-label>
          <input matInput formControlName="login" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="mdd-field">
          <mat-label>Mot de passe</mat-label>
          <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" />
          <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <div fxLayout="column" fxLayoutAlign="center center">
          <button mat-flat-button color="primary" class="mdd-btn mdd-btn--primary" type="submit" [disabled]="form.invalid">
            Se connecter
          </button>

          @if (onError) {
            <p class="error">Une erreur est survenue</p>
          }
        </div>
      </mat-card-content>
    </form>
  </mat-card>
</div>
